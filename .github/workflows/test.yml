name: Validation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit & Integration Tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: brew install bats-core shellcheck coreutils parallel

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run test script
        env:
          MOLE_PERF_BYTES_TO_HUMAN_LIMIT_MS: "6000"
          MOLE_PERF_GET_FILE_SIZE_LIMIT_MS: "3000"
          MOLE_PERF_NORMALIZE_PATHS_LIMIT_MS: "10000"
          MOLE_TEST_JOBS: "6"
          # Emits a "Slowest test files" table at the end of the run. Parallel
          # TAP output cannot be attributed to a file, so without this a single
          # slow file that sets the whole job's wall clock stays invisible.
          MOLE_TEST_REPORT_DIR: ${{ runner.temp }}/bats-report
          BATS_FORMATTER: tap
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: ./scripts/test.sh

      # TEMPORARY diagnostic, remove once the answer is in. The two
      # clean_core.bats tests that drive the full pipeline cost ~30s each on a
      # runner and ~3.6s on a dev machine, and nothing local reproduces it.
      # This attributes the cost to a section without changing any timeout
      # budget, so it cannot turn the job red or alter what the suite asserts.
      - name: Diagnose clean dry-run cost on this runner
        if: always()
        continue-on-error: true
        env:
          MOLE_TEST_NO_AUTH: "1"
          MO_DEBUG: "1"
          MO_NO_OPLOG: "1"
        run: |
          diag_home="$(mktemp -d)"
          mkdir -p "$diag_home/Library/Caches" "$diag_home/.config/mole"
          log="${RUNNER_TEMP}/clean-diag.txt"

          # Reproduce the test's environment exactly, seams included, so what
          # this measures is the cost that survived them rather than the raw
          # pipeline. Mirrors tests/clean_core.bats setup_file plus its brew
          # and xcrun stubs.
          stub_bin="$diag_home/stub-bin"
          mkdir -p "$stub_bin"
          printf '#!/bin/bash\nexit 0\n' > "$stub_bin/brew"
          printf '#!/bin/bash\nexit 1\n' > "$stub_bin/xcrun"
          chmod +x "$stub_bin/brew" "$stub_bin/xcrun"

          start=$(date +%s)
          env HOME="$diag_home" \
            MOLE_TEST_MODE=0 \
            MOLE_LSREGISTER_PATH= \
            MOLE_XCODE_SIM_RUNTIME_VOLUMES_ROOT="$diag_home/absent-volumes" \
            MOLE_XCODE_SIM_RUNTIME_CRYPTEX_ROOT="$diag_home/absent-cryptex" \
            PATH="$stub_bin:$PATH" \
            ./mole clean --dry-run 2>&1 |
            perl -ne 'BEGIN { $| = 1 } print time, "|", $_' > "$log" || true
          echo "total wall clock: $(($(date +%s) - start))s"

          echo "--- gaps of 2s or more (cost lands on the line that follows) ---"
          sed $'s/\x1b\\[[0-9;]*m//g' "$log" |
            awk -F'|' '
              prev != "" && $1 - prev >= 2 {
                printf "  %3ds before: %s\n", $1 - prev, substr($2, 1, 100)
              }
              { prev = $1 }
            '

          echo "--- slowest PERF probes ---"
          sed $'s/\x1b\\[[0-9;]*m//g' "$log" |
            sed -n 's/.*PERF \[\(.*\)\] \([0-9.]*\)s.*/\2 \1/p' |
            sort -rn | head -20

  compatibility:
    name: macOS
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: brew install bats-core coreutils

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Smoke load on ${{ matrix.os }}
        run: |
          echo "Testing on ${{ matrix.os }}..."
          bash -n mole
          source lib/core/common.sh
          echo "✓ Successfully loaded on ${{ matrix.os }}"

      - name: Run core bats subset
        env:
          MOLE_TEST_NO_AUTH: "1"
          MOLE_PERF_NORMALIZE_PATHS_LIMIT_MS: "10000"
          BATS_FORMATTER: tap
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          bats tests/core_safe_functions.bats \
               tests/core_common.bats \
               tests/core_timeout.bats \
               tests/regression.bats \
               tests/cli.bats

  security:
    name: Security Checks
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install tools
        run: brew install bats-core coreutils

      - name: Check for unsafe rm usage
        run: |
          echo "Checking for unsafe rm patterns..."
          # Filters in order:
          #   safe_remove / validate_path: known safe wrapper helpers in file_ops.sh
          #   # SAFE: explicit annotation that a direct rm is gated by narrow checks
          #   ^path:line:[ws]#: pure comment lines that mention rm -rf in docs
          #   echo : help text or messages that print rm -rf as documentation
          if grep -rn "rm -rf" lib/ bin/ install.sh mole 2>/dev/null | grep -v -E "safe_remove|validate_path|# SAFE|^[^:]+:[0-9]+:[[:space:]]*#|echo "; then
            echo "✗ Unsafe rm -rf usage found (annotate gated calls with '# SAFE: <reason>' or route through safe_remove)"
            exit 1
          fi
          echo "✓ No unsafe rm usage found"

      - name: Verify app protection
        run: |
          echo "Verifying critical file protection..."
          bash -c '
          source lib/core/common.sh
          if should_protect_from_uninstall "com.apple.Safari"; then
            echo "✓ Safari is protected"
          else
            echo "✗ Safari protection failed"
            exit 1
          fi
          '

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run high-risk path regression tests
        env:
          MOLE_TEST_NO_AUTH: "1"
          BATS_FORMATTER: tap
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: bats tests/core_safe_functions.bats tests/purge.bats tests/installer.bats
